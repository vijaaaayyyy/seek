name: fix-app-shell
on:
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Always show BackdropField
        run: |
          python3 << 'PY'
          from pathlib import Path
          p = Path("src/components/app-shell.tsx")
          t = p.read_text()
          old = '{!isHome && <BackdropField base className="-z-10" />}'
          new = '<BackdropField intensity="full" className="-z-10" />'
          if old in t:
              t = t.replace(old, new)
              p.write_text(t)
              print("replaced")
          else:
              print("pattern not found")
              # show nearby lines
              for i, line in enumerate(t.splitlines()):
                  if "Backdrop" in line:
                      print(i, line)
          PY
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add src/components/app-shell.tsx
          git diff --cached --quiet || git commit -m "feat: always-on immersive BackdropField sitewide"
          git push
